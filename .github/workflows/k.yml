
name: Recover Original Branch History

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply recovery after reviewing the report"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Find Previous Branch SHAs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          apply_changes = os.environ["APPLY"].lower() == "true"
          api_root = f"https://api.github.com/repos/{repository}"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "branch-history-recovery"
          }

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()

              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path}: {error.code} {detail}"
                  )

          def pages(path):
              results = []

              for page in range(1, 11):
                  batch = api(
                      "GET",
                      f"{path}?per_page=100&page={page}"
                  )

                  if not isinstance(batch, list):
                      break

                  results.extend(batch)

                  if len(batch) < 100:
                      break

              return results

          branches = pages("/branches")

          branch_heads = {
              item["name"]: item["commit"]["sha"]
              for item in branches
          }

          events = pages("/events")
          candidates = {}

          for event in events:
              if event.get("type") != "PushEvent":
                  continue

              payload = event.get("payload") or {}
              ref = payload.get("ref") or ""

              if not ref.startswith("refs/heads/"):
                  continue

              branch = ref[len("refs/heads/"):]
              current_sha = branch_heads.get(branch)
              pushed_sha = payload.get("head") or payload.get("after")
              previous_sha = payload.get("before") or ""

              if current_sha and pushed_sha == current_sha and previous_sha:
                  if previous_sha != "0" * 40 and previous_sha != current_sha:
                      if branch not in candidates:
                          candidates[branch] = {
                              "previous": previous_sha,
                              "current": current_sha
                          }

          timestamp = time.strftime(
              "%Y%m%d-%H%M%S",
              time.gmtime()
          )

          report = [
              "# Branch Recovery Report",
              "",
              f"Repository: {repository}",
              f"Mode: {'APPLY' if apply_changes else 'DRY RUN'}",
              "",
              "| Branch | Current SHA | Previous SHA | Available | Result |",
              "|---|---|---|---|---|"
          ]

          restored = 0

          for branch, candidate in sorted(candidates.items()):
              old_sha = candidate["previous"]
              current_sha = candidate["current"]

              exists = False
              message = ""

              try:
                  old_commit = api("GET", f"/commits/{old_sha}")
                  exists = True
                  message = (
                      old_commit.get("commit", {})
                      .get("message", "")
                      .splitlines()[0]
                  )
              except Exception as error:
                  message = str(error).replace("|", "/")

              result = "Found; not changed"

              if exists and apply_changes:
                  encoded_branch = urllib.parse.quote(
                      branch,
                      safe="/"
                  )

                  try:
                      current_ref = api(
                          "GET",
                          f"/git/ref/heads/{encoded_branch}"
                      )

                      live_sha = current_ref.get("object", {}).get("sha")

                      if live_sha != current_sha:
                          raise RuntimeError(
                              "Branch changed after discovery; skipped"
                          )

                      backup_ref = (
                          f"refs/heads/recovery-backup/"
                          f"{timestamp}/{branch}"
                      )

                      api("POST", "/git/refs", {
                          "ref": backup_ref,
                          "sha": current_sha
                      })

                      api(
                          "PATCH",
                          f"/git/refs/heads/{encoded_branch}",
                          {
                              "sha": old_sha,
                              "force": True
                          }
                      )

                      result = f"Restored; backup: {backup_ref}"
                      restored += 1

                  except Exception as error:
                      result = (
                          "Restore failed: "
                          + str(error).replace("|", "/")
                      )

              report.append(
                  f"| {branch} | {current_sha} | {old_sha} | "
                  f"{'Yes' if exists else 'No'} | {result} |"
              )

              if message:
                  report.append(
                      f"\nCommit for {branch}: {message}"
                  )

          if not candidates:
              report.extend([
                  "| No matching candidates | — | — | — | No changes |",
                  "",
                  "No previous branch tips were found in repository events."
              ])

          report.extend([
              "",
              f"Branches restored: {restored}",
              "",
              "Unverified commits were never restored."
          ])

          report_text = "\n".join(report) + "\n"

          with open(
              "recovery-report.md",
              "w",
              encoding="utf-8"
          ) as output:
              output.write(report_text)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with open(
                  summary_path,
                  "a",
                  encoding="utf-8"
              ) as output:
                  output.write(report_text)

          print(report_text)
          PY

      - name: Upload Recovery Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-history-recovery-report
          path: recovery-report.md
          if-no-files-found: warn
