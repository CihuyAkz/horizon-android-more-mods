name: Remove Litematica Completely

on:
  workflow_dispatch:
    inputs:
      confirm_removal:
        description: "Confirm permanent removal of Horizonmatica/Litematica from this branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: remove-litematica-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove-litematica:
    if: ${{ inputs.confirm_removal == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Remove the complete Horizonmatica/Litematica implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          android_file = root / "crates/horizon-client/src/game/android_bundled.rs"
          if not android_file.is_file():
              raise SystemExit(
                  "Expected Horizon Android source was not found: "
                  "crates/horizon-client/src/game/android_bundled.rs"
              )

          # Remove the Android storage bootstrap, the complete mod source tree,
          # and its setup documentation. Missing paths are OK on reruns.
          remove_paths = [
              "mods/official/horizonmatica",
              "crates/horizon-client/src/game/litematica_storage.rs",
              "docs/litematica-storage-android.md",
              "docs/litematica-storage.md",
          ]
          removed = []
          for relative in remove_paths:
              path = root / relative
              if path.is_dir():
                  shutil.rmtree(path)
                  removed.append(relative)
              elif path.is_file() or path.is_symlink():
                  path.unlink()
                  removed.append(relative)

          # Remove the in-game Mod List catalogue entry (the UI label/description
          # is also a tracked Litematica reference). Handle both compact and
          # rustfmt-expanded tuple layouts.
          mod_list = root / "crates/horizon-client-render/src/mod_list.rs"
          if mod_list.is_file():
              text = mod_list.read_text(encoding="utf-8")
              updated_mod_list, count = re.subn(
                  r'(?ms)^\s*\(\s*"horizonmatica"\s*,\s*"Horizonmatica"\s*,\s*"[^"]*(?:Litematica|schematic)[^"]*"\s*,?\s*\),?\s*\n?',
                  "",
                  text,
              )
              if updated_mod_list != text:
                  marker = "pub const ANDROID_BUNDLED:"
                  start = updated_mod_list.find(marker)
                  if start >= 0:
                      end = updated_mod_list.find("];", start)
                      if end >= 0:
                          section = updated_mod_list[start:end]
                          item_count = len(re.findall(r'^\s*(?:\(\s*)?"[a-z0-9_]+"', section, re.M))
                          updated_mod_list, count = re.subn(
                              r'(pub const ANDROID_BUNDLED:\s*\[\(&str,\s*&str,\s*&str\);\s*)\d+(\]\s*=\s*\[)',
                              rf"\g<1>{item_count}\g<2>",
                              updated_mod_list,
                              count=1,
                          )
                  mod_list.write_text(updated_mod_list, encoding="utf-8", newline="\n")
                  removed.append("Horizonmatica Mod List catalogue entry")

          # Remove tests that only assert the deleted Litematica storage wiring,
          # and remove any stale catalogue assertion from shared Punchy tests.
          for test_file in root.rglob("*.py"):
              if ".git" in test_file.parts or ".venv" in test_file.parts:
                  continue
              try:
                  text = test_file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              # Drop a complete unittest method whose name identifies the
              # removed Horizonmatica/Litematica behavior.
              text = re.sub(
                  r'(?ms)^    def test_[^\n]*(?:horizonmatica|litematica)[^\n]*:\n.*?(?=^    def |^class |\Z)',
                  "",
                  text,
                  flags=re.IGNORECASE,
              )
              def remove_storage_token(match):
                  if match.group("left"):
                      return match.group("right") or ""
                  return ""

              text = re.sub(
                  r'(?P<left>,[ \t]*)["\']litematica_storage::listed["\'](?P<right>[ \t]*,)?',
                  remove_storage_token,
                  text,
                  flags=re.IGNORECASE,
              )
              if "litematica_storage::listed" in original.lower():
                  text = re.sub(
                      r'test_catalog_has_all_18_bundled_android_mods',
                      "test_catalog_has_all_17_bundled_android_mods",
                      text,
                  )
                  text = re.sub(
                      r'(self\.assertEqual\(len\(ids\),\s*)18(\s*\))',
                      r'\g<1>17\g<2>',
                      text,
                  )
              if text != original:
                  test_file.write_text(text, encoding="utf-8", newline="\n")
                  removed.append(str(test_file.relative_to(root)))

          # Disconnect every Android entry point to the removed storage module.
          source = android_file.read_text(encoding="utf-8")
          updated = re.sub(
              r'(?m)^#\[cfg\(target_os = "android"\)\]\r?\n'
              r'^#\[path = "litematica_storage\.rs"\]\r?\n'
              r'^mod litematica_storage;\r?\n?',
              "",
              source,
          )
          updated, removed_calls = re.subn(
              r"(?m)^[ \t]*litematica_storage::[^\r\n]*\r?\n?",
              "",
              updated,
          )
          if "litematica_storage" in updated.lower():
              raise SystemExit(
                  "Unrecognized litematica_storage reference remains in "
                  "android_bundled.rs; stopping without committing."
              )
          if updated != source:
              android_file.write_text(updated, encoding="utf-8", newline="\n")
              removed.append("Android storage-module wiring")

          print("Removed:")
          for item in removed:
              print(f"  - {item}")
          print(f"Android storage call sites removed: {removed_calls}")
          PY

      - name: Verify no Litematica references remain in tracked source
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -i -E 'horizonmatica|litematica' -- . ':(exclude).github/workflows/remove-litematica.yml'; then
            echo "Litematica-related references remain. No commit was made; inspect the lines above."
            exit 1
          else
            echo "No Horizonmatica/Litematica references remain in tracked source."
          fi
          test ! -e mods/official/horizonmatica
          test ! -e crates/horizon-client/src/game/litematica_storage.rs
          test ! -e docs/litematica-storage.md
          test ! -e docs/litematica-storage-android.md

      - name: Commit and push the removal to the selected branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Litematica is already removed; nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Remove Horizonmatica and Litematica completely"
          git push origin "HEAD:${TARGET_BRANCH}"
          {
            echo "## Litematica removal complete"
            echo "Removed Horizonmatica/Litematica sources, Android storage setup, and Android hooks."
            echo "Updated branch: ${TARGET_BRANCH}."
          } >> "$GITHUB_STEP_SUMMARY"
