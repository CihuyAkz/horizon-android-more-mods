
name: Undo Self Destruct

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Self-destruct commit SHA to revert'
        required: true
        type: string
      confirm:
        description: 'Type RESTORE to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESTORE" ]; then
            echo "Confirmation failed."
            exit 1
          fi

      - name: Checkout Selected Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate Commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! git cat-file -e "${COMMIT_SHA}^{commit}"; then
            echo "Invalid commit SHA."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$COMMIT_SHA" HEAD; then
            echo "Commit is not in this branch history."
            exit 1
          fi

      - name: Revert Self Destruct
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-edit "$COMMIT_SHA"

      - name: Push Restored Branch
        run: |
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
