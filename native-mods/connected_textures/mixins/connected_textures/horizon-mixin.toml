[mod]
id = "connected_textures"
version = "0.1.7"
priority = 100

[compatibility]
horizon_revision = "0000000000000000000000000000000000000000"

[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_connected_textures"
source = "native_connected_textures.rs"
visibility = "pub"

[[module]]
id = "frame_adapter"
file = "crates/horizon-client/src/game.rs"
name = "connected_textures_frame"
source = "frame_adapter.rs"

[[module]]
id = "list_adapter"
file = "crates/horizon-client/src/game.rs"
name = "connected_textures_list"
source = "list_adapter.rs"

[[module]]
id = "settings_adapter"
file = "crates/horizon-client/src/game.rs"
name = "connected_textures_settings"
source = "settings_adapter.rs"

[[module]]
id = "click_adapter"
file = "crates/horizon-client/src/game.rs"
name = "connected_textures_click"
source = "click_adapter.rs"

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "hooks/frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "hooks/list.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "hooks/settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" }
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "hooks/click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" }
]

[[injection]]
id = "mesh"
kind = "HEAD"
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
helper = "mesh.rs"
cancellable = true
bindings = [
  { name = "mesher", ty = "&mut Mesher<'_>", value = "&mut *self" },
  { name = "region", ty = "&[[Option<&Chunk>; 3]; 3]", value = "region" },
  { name = "sy", ty = "i32", value = "sy" },
  { name = "out", ty = "&mut SectionMesh", value = "&mut out" },
  { name = "scratch", ty = "&mut MeshScratch", value = "scratch" }
]
